<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" role="img" aria-labelledby="title desc">
  <title id="title">Siły w dwóch fazach lotu</title>
  <desc id="desc">Siła ciężkości jest skierowana w dół; siła oporu działa przeciwnie do wektora prędkości podczas wznoszenia i opadania.</desc>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="blueArrow" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto"><path d="M0 0L16 8L0 16Z" fill="#2563eb"/></marker>
    <marker id="redArrow" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto"><path d="M0 0L16 8L0 16Z" fill="#dc2626"/></marker>
    <marker id="yellowArrow" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto"><path d="M0 0L16 8L0 16Z" fill="#eab308"/></marker>
  </defs>
  <path d="M450 52V390" stroke="#9ca3af" stroke-width="2"/>
  <text x="95" y="60" font-family="'Times New Roman', Times, serif" font-size="24" font-weight="700" fill="#000000">Wznoszenie</text>
  <text x="560" y="60" font-family="'Times New Roman', Times, serif" font-size="24" font-weight="700" fill="#000000">Opadanie</text>
  <circle cx="220" cy="235" r="20" fill="#eab308"/>
  <path d="M240 220L324 150" stroke="#2563eb" stroke-width="5" marker-end="url(#blueArrow)"/>
  <path d="M199 254L139 304" stroke="#dc2626" stroke-width="5" marker-end="url(#redArrow)"/>
  <path d="M220 264V352" stroke="#eab308" stroke-width="5" marker-end="url(#yellowArrow)"/>
  <text x="332" y="142" font-family="'Times New Roman', Times, serif" font-size="19" fill="#000000">v</text>
  <text x="95" y="330" font-family="'Times New Roman', Times, serif" font-size="18" fill="#000000">Fₒₚ</text>
  <text x="230" y="346" font-family="'Times New Roman', Times, serif" font-size="18" fill="#000000">mg</text>
  <circle cx="670" cy="235" r="20" fill="#eab308"/>
  <path d="M690 250L774 320" stroke="#2563eb" stroke-width="5" marker-end="url(#blueArrow)"/>
  <path d="M650 220L588 168" stroke="#dc2626" stroke-width="5" marker-end="url(#redArrow)"/>
  <path d="M670 264V352" stroke="#eab308" stroke-width="5" marker-end="url(#yellowArrow)"/>
  <text x="782" y="337" font-family="'Times New Roman', Times, serif" font-size="19" fill="#000000">v</text>
  <text x="510" y="150" font-family="'Times New Roman', Times, serif" font-size="18" fill="#000000">Fₒₚ</text>
  <text x="680" y="346" font-family="'Times New Roman', Times, serif" font-size="18" fill="#000000">mg</text>
  <text x="95" y="405" font-family="'Times New Roman', Times, serif" font-size="18" fill="#000000">Siła oporu działa przeciwnie do wektora prędkości.</text>
  <text x="535" y="405" font-family="'Times New Roman', Times, serif" font-size="18" fill="#000000">Siła ciężkości zawsze działa w dół.</text>
</svg>