<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" role="img" aria-labelledby="title desc">
  <title id="title">Rozkład wektora prędkości dla 36 m/s i 34 stopni</title>
  <desc id="desc">Wektor prędkości o wartości 36 metrów na sekundę rozłożony na składową poziomą o wartości 29,85 metra na sekundę oraz składową pionową o wartości 20,13 metra na sekundę.</desc>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="axisArrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#000000"/></marker>
    <marker id="blueArrow" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0 0L14 7L0 14Z" fill="#2563eb"/></marker>
    <marker id="redArrow" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0 0L14 7L0 14Z" fill="#dc2626"/></marker>
    <marker id="yellowArrow" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0 0L14 7L0 14Z" fill="#eab308"/></marker>
  </defs>
  <text x="96" y="28" font-family="'Times New Roman', Times, serif" font-size="22" font-weight="700" fill="#000000">Rozkład prędkości początkowej</text>
  <text x="96" y="58" font-family="'Times New Roman', Times, serif" font-size="18" fill="#000000">v₀ = 36 m/s, kąt θ = 34°</text>
  <path d="M115 350H810" stroke="#000000" stroke-width="3" marker-end="url(#axisArrow)"/>
  <path d="M160 395V110" stroke="#000000" stroke-width="3" marker-end="url(#axisArrow)"/>
  <path d="M160 350L510 114" stroke="#2563eb" stroke-width="6" marker-end="url(#blueArrow)"/>
  <path d="M160 350H510" stroke="#dc2626" stroke-width="5" marker-end="url(#redArrow)"/>
  <path d="M510 350V114" stroke="#eab308" stroke-width="5" marker-end="url(#yellowArrow)"/>
  <path d="M230 350A70 70 0 0 0 218 311" fill="none" stroke="#000000" stroke-width="2.5"/>
  <circle cx="160" cy="350" r="7" fill="#000000"/>
  <text x="245" y="337" font-family="'Times New Roman', Times, serif" font-size="21" fill="#000000">34°</text>
  <text x="250" y="150" font-family="'Times New Roman', Times, serif" font-size="24" font-weight="700" fill="#000000">v₀ = 36 m/s</text>
  <text x="275" y="395" font-family="'Times New Roman', Times, serif" font-size="21" fill="#000000">vₓ₀ = 29,85 m/s</text>
  <text x="535" y="232" font-family="'Times New Roman', Times, serif" font-size="21" fill="#000000">vᵧ₀ = 20,13 m/s</text>
  <text x="787" y="385" font-family="'Times New Roman', Times, serif" font-size="21" fill="#000000">x</text>
  <text x="136" y="126" font-family="'Times New Roman', Times, serif" font-size="21" fill="#000000">y</text>
</svg>